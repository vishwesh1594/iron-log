:root{
  --bg:#0C0F14; --surface:#151A22; --raised:#1B212B; --sunken:#10141B;
  --line:rgba(151,162,179,.14); --line-strong:rgba(151,162,179,.24);
  --text:#E9EDF3; --muted:#97A2B3; --faint:#5F6A7B;
  --accent:#E8A33D; --accent-hi:#F2B44D; --accent-ink:#1A1104; --accent-dim:rgba(232,163,61,.14);
  --good:#45C98C; --good-dim:rgba(69,201,140,.13);
  --danger:#E5654F;
  --disp:'Barlow Condensed',system-ui,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0C0F14}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:inherit}
input,textarea{font-family:var(--body);color:var(--text);background:var(--sunken);border:1px solid var(--line);border-radius:10px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}

/* ---------- header ---------- */
header{padding:calc(14px + env(safe-area-inset-top,0)) 18px 0;position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg,#0C0F14 78%,rgba(12,15,20,0));padding-bottom:10px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--disp);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase}
.brand em{font-style:normal;color:var(--accent)}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:10.5px;letter-spacing:.14em;color:var(--faint);margin-top:-3px}

/* dates */
function iso(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function todayISO(){return iso(new Date());}
function mondayOf(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;}
function todayDayKey(){return DAY_KEYS[(new Date().getDay()+6)%7];}
/* date (ISO) of the selected pill in the viewed week (weekOff weeks from now) */
function selDate(){const m=mondayOf(new Date());m.setDate(m.getDate()+ui.weekOff*7+DAY_KEYS.indexOf(ui.selDay));return iso(m);}
function weekdayKey(dateISO){return DAY_KEYS[(new Date(dateISO+'T12:00:00').getDay()+6)%7];}
/* effective workout template for a date — honours day swaps */
function effKey(dateISO,dayKey){return S.swap[dateISO]||dayKey;}
/* which phase+week of the program a viewed week maps to, anchored to the
   week the current phase/week was set (so a mid-week or Sunday start
   doesn't lose its first week), rolling across phases */
function progAt(off){
  const a=mondayOf(new Date((S.settings.anchor||todayISO())+'T12:00:00'));
  const vm=mondayOf(new Date());vm.setDate(vm.getDate()+off*7);
  const d=Math.round((vm-a)/(7*864e5));
  let p=S.settings.phase,w=S.settings.week+d;
  while(w>3&&p<PROGRAM.length-1){w-=4;p++;}
  while(w<0&&p>0){p--;w+=4;}
  return{p:p,w:Math.max(0,Math.min(3,w))};
}
/* anchor rule: selecting a phase/week starts that week from the coming
   Monday unless today already is Monday */
function anchorForNewSelection(){
  const m=mondayOf(new Date());
  if(iso(m)!==todayISO()){m.setDate(m.getDate()+7);}
  return iso(m);
}

/* auto-advance week: anchored to the Monday of the week it was set */
(function autoAdvance(){
  const st=S.settings;
  if(!st.anchor){st.anchor=iso(mondayOf(new Date()));saveState();return;}
  const a=mondayOf(new Date(st.anchor+'T12:00:00'));
  const n=mondayOf(new Date());
  const wks=Math.round((n-a)/(7*864e5));
  if(wks>0){
    const maxW=PROGRAM[st.phase].weeks.length-1;
    const newW=Math.min(st.week+wks,maxW);
    if(newW!==st.week){st.week=newW;setTimeout(()=>toast('Moved to '+PROGRAM[st.phase].weeks[newW]+' — change it in settings if needed'),600);}
    st.anchor=iso(n);saveState();
  }
})();

/* ============================================================ HELPERS ============================================================ */
const $=s=>document.querySelector(s);
function slug(n){return n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function parseT(t){const m=/^(\d+)x(.+)$/.exec(t);if(!m)return{sets:1,reps:t,repN:0};
  const reps=m[2].replace('-','–').replace('ea',' ea');
  const repN=parseInt(m[2],10)||0;
  return{sets:+m[1],reps,repN};}
function restFor(repN){return repN>=12?30:(repN>=8?120:180);}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function fmtDate(isoStr){const d=new Date(isoStr+'T12:00:00');
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});}

let ui={tab:'today',selDay:todayDayKey(),weekOff:0};

function curPhase(){return PROGRAM[S.settings.phase];}
function log(dateStr){return S.logs[dateStr];}
function ensureLog(dateStr,dayKey,ph,wk){
  if(!S.logs[dateStr])S.logs[dateStr]={phase:ph!=null?ph:S.settings.phase,week:wk!=null?wk:S.settings.week,day:dayKey,sets:{},checks:{}};
  return S.logs[dateStr];
}
/* most recent previous session containing this exercise */
function lastSession(exSlug,beforeDate){
  const dates=Object.keys(S.logs).filter(d=>d<beforeDate).sort().reverse();
  for(const d of dates){
    const l=S.logs[d];
    if(l.sets&&l.sets[exSlug]&&l.sets[exSlug].some(s=>s&&s.d))return{date:d,sets:l.sets[exSlug]};
  }
  return null;
}
/* full history of an exercise across every phase & week, newest first */
function exHistory(exSlug,max){
  const out=[];
  const dates=Object.keys(S.logs).sort().reverse();
  for(const d of dates){
    const l=S.logs[d];
    const arr=l.sets&&l.sets[exSlug];
    if(!arr||!arr.some(s=>s&&s.d))continue;
    const ph=PROGRAM[l.phase];
    out.push({date:d,tag:(ph?ph.name.replace('Phase ','P'):'?')+' · W'+((l.week||0)+1),
      sets:arr.filter(s=>s&&s.d).map(s=>(s.w||'–')+'kg×'+(s.r||'–'))});
    if(out.length>=(max||8))break;
  }
  return out;
}
function toast(msg,ms){const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),ms||2600);}

/* ============================================================ BODY WEIGHT ============================================================ */
function prevBw(beforeDate){
  const dates=Object.keys(S.bw).filter(d=>d<beforeDate).sort().reverse();
  return dates.length?{date:dates[0],kg:S.bw[dates[0]]}:null;
}
function bwCard(tISO){
  const cur=S.bw[tISO];
  const prev=prevBw(tISO);
  let delta='';
  if(cur!=null&&prev){
    const d=Math.round((cur-prev.kg)*10)/10;
    delta='<b>'+(d>0?'+':'')+d+' kg</b>vs '+fmtDate(prev.date).replace(/^\w+ /,'');
  }else if(prev){delta='<b>'+prev.kg+'</b>last · '+fmtDate(prev.date).replace(/^\w+ /,'');}
  return '<div class="card bwcard"><div class="bwlbl"><div class="t">Body Weight</div><small>'+fmtDate(tISO)+'</small></div>'+
    '<div class="bwfield"><input id="bwin" type="text" inputmode="decimal" placeholder="'+(prev?prev.kg:'–')+'" value="'+(cur!=null?cur:'')+'" aria-label="Body weight kg"><span class="unit">KG</span></div>'+
    '<div class="bwdelta" id="bwdelta">'+delta+'</div></div>';
}

/* ============================================================ CLOUD SYNC (GitHub Gist) ============================================================ */
let syncTimer=null,syncBusy=false,syncQueued=false;
function scheduleSync(){if(!SY.token)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>pushCloud(false),2500);}
/* find an existing IRON·LOG backup gist on this account (prevents duplicates across devices) */
async function findExistingGist(){
  try{
    const res=await fetch('https://api.github.com/gists?per_page=100',{headers:ghHeaders()});
    if(!res.ok)return null;
    const arr=await res.json();
    const g=arr.find(x=>x.files&&x.files['ironlog-backup.json']);
    return g?g.id:null;
  }catch(e){return null;}
}
function ghHeaders(){return{'Authorization':'Bearer '+SY.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'};}
function syncLabel(){return SY.last?('Last synced '+new Date(SY.last).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})):'Never synced';}
async function pushCloud(manual){
  if(!SY.token){if(manual)toast('Connect GitHub in Settings first');return;}
  if(syncBusy){syncQueued=true;return;}   /* serialize: never two in-flight pushes */
  syncBusy=true;
  try{await pushCloudInner(manual);}
  finally{syncBusy=false;if(syncQueued){syncQueued=false;scheduleSync();}}
}
async function pushCloudInner(manual){
  const payload=JSON.stringify({settings:S.settings,logs:S.logs,bw:S.bw,swap:S.swap},null,1);
  const body={description:'IRON·LOG data backup (auto-synced)',files:{'ironlog-backup.json':{content:payload}}};
  try{
    let res;
    if(!SY.gistId){                       /* adopt an existing backup gist before ever creating one */
      const existing=await findExistingGist();
      if(existing){SY.gistId=existing;saveSync();}
    }
    if(SY.gistId){
      res=await fetch('https://api.github.com/gists/'+SY.gistId,{method:'PATCH',headers:ghHeaders(),body:JSON.stringify(body)});
      if(res.status===404){SY.gistId='';saveSync();return pushCloudInner(manual);}
    }else{
      body.public=false;
      res=await fetch('https://api.github.com/gists',{method:'POST',headers:ghHeaders(),body:JSON.stringify(body)});
    }
    if(res.status===401||res.status===403)throw{code:'auth'};
    if(!res.ok)throw{code:'http',status:res.status};
    const j=await res.json();
    SY.gistId=j.id;SY.last=Date.now();saveSync();
    const el=document.getElementById('synclast');if(el)el.textContent=syncLabel();
    if(manual)toast('Synced to your GitHub ✓');
  }catch(e){
    if(manual)toast(e&&e.code==='auth'?'Token rejected — it needs the “gist” permission':'Sync failed — check connection & try again');
  }
}
async function restoreCloud(){
  if(!SY.token||!SY.gistId){toast(SY.token?'Nothing synced yet':'Connect GitHub first');return;}
  try{
    const res=await fetch('https://api.github.com/gists/'+SY.gistId,{headers:ghHeaders()});
    if(!res.ok)throw 0;
    const j=await res.json();
    const f=j.files&&j.files['ironlog-backup.json'];
    if(!f)throw 0;
    let content=f.content;
    if(f.truncated){content=await (await fetch(f.raw_url)).text();}
    const data=JSON.parse(content);
    if(!data.settings||!data.logs)throw 0;
    S={settings:data.settings,logs:data.logs,bw:data.bw||{},swap:data.swap||{}};
    saveState();closeSheet();renderHeader();render();toast('Restored from cloud ✓');
  }catch(e){toast('Could not restore from cloud');}
}

/* ============================================================ REST TIMER ============================================================ */
const timer={end:0,total:0,iv:null};
function startTimer(secs){
  timer.end=Date.now()+secs*1000;timer.total=secs;
  const bar=$('#timerbar');bar.classList.add('show');bar.classList.remove('zero');
  clearInterval(timer.iv);timer.iv=setInterval(tickTimer,250);tickTimer();
}
function tickTimer(){
  const left=Math.max(0,Math.ceil((timer.end-Date.now())/1000));
  $('#tval').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  $('#tfill').style.width=(timer.total?100*left/timer.total:0)+'%';
  if(left<=0){
    clearInterval(timer.iv);$('#timerbar').classList.add('zero');$('#tval').textContent='GO!';
    if(navigator.vibrate)navigator.vibrate([250,120,250]);
    setTimeout(hideTimer,2500);
  }
}
function hideTimer(){clearInterval(timer.iv);$('#timerbar').classList.remove('show');}
$('#tplus').addEventListener('click',()=>{timer.end+=30000;timer.total+=30;$('#timerbar').classList.remove('zero');clearInterval(timer.iv);timer.iv=setInterval(tickTimer,250);tickTimer();});
$('#tskip').addEventListener('click',hideTimer);

/* ============================================================ SHARE ============================================================ */
function swapBtn(){
  return '<button class="iconbtn" id="swapbtn" aria-label="Swap this day\u2019s workout" style="margin-left:auto;flex:none">'+
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M21 3l-7 7M8 21H3v-5M3 21l7-7"/></svg></button>';
}
function shareBtn(){
  return '<button class="iconbtn" id="sharebtn" aria-label="Share this day" style="margin-left:8px;flex:none">'+
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg></button>';
}
function buildShareText(dayKey,tISO,vP,vW){
  const ph=PROGRAM[vP],day=ph.days[dayKey],l=log(tISO);
  const lines=['\u{1F3CB}\uFE0F IRON\u00B7LOG \u2014 '+fmtDate(tISO)];
  if(day.rest||day.steps){
    lines.push(day.rest?'Rest day \u00B7 '+(day.note||'recovery'):'Active recovery \u00B7 10K steps');
    if(l&&l.checks&&l.checks.goal)lines.push('\u2705 Goal done');
  }else{
    lines.push(day.title+(day.sub?' ('+day.sub+')':'')+' \u00B7 '+ph.name+' \u00B7 '+ph.weeks[vW]);
    const p=setsDoneCount(l,day,vW);
    let vol=0;
    if(l&&l.sets)Object.values(l.sets).forEach(a=>a.forEach(x=>{if(x&&x.d){const w=parseFloat(x.w),r=parseFloat(x.r);if(w&&r)vol+=w*r;}}));
    if(p.done>0){
      lines.push('\u2705 '+p.done+'/'+p.total+' sets'+(vol?' \u00B7 '+(Math.round(vol/100)/10)+' t lifted':''));
      lines.push('');
      day.ex.forEach(e=>{
        const arr=l&&l.sets&&l.sets[slug(e.n)];
        if(!arr||!arr.some(x=>x&&x.d))return;
        lines.push(e.n+': '+arr.filter(x=>x&&x.d).map(x=>(x.w||'\u2013')+'\u00D7'+(x.r||'\u2013')).join(', '));
      });
    }else{
      lines.push('Today\u2019s plan:');
      lines.push('');
      day.ex.forEach(e=>{const t=parseT(e.w[vW]);lines.push('\u2022 '+e.n+' \u2014 '+t.sets+'\u00D7'+t.reps);});
    }
  }
  if(S.bw[tISO]!=null)lines.push('','Body weight: '+S.bw[tISO]+' kg');
  return lines.join('\n');
}
async function shareDay(dayKey,tISO,vP,vW){
  const text=buildShareText(dayKey,tISO,vP,vW);
  if(navigator.share){
    try{await navigator.share({text:text});}catch(e){/* user cancelled */}
  }else{
    try{await navigator.clipboard.writeText(text);toast('Copied \u2014 paste it into any chat');}
    catch(e){toast('Sharing not available here');}
  }
}

/* ============================================================ HEADER ============================================================ */
function renderHeader(){
  const v=progAt(ui.weekOff);
  const ph=PROGRAM[v.p];
  $('#phaselabel').textContent=ph.name+' — '+ph.weeks[v.w];
  const home=ui.weekOff===0&&ui.selDay===todayDayKey();
  $('#todaychip').style.display=home?'none':'inline-flex';
  const strip=$('#daystrip');strip.innerHTML='';
  const mon=mondayOf(new Date());mon.setDate(mon.getDate()+ui.weekOff*7);
  const tk=todayDayKey();
  const mkNav=(dir,label)=>{
    const b=document.createElement('button');
    b.className='weeknav';b.setAttribute('aria-label',label);
    b.innerHTML=dir<0?'&lsaquo;':'&rsaquo;';
    b.addEventListener('click',()=>{ui.weekOff+=dir;renderHeader();render();});
    return b;
  };
  strip.appendChild(mkNav(-1,'Previous week'));
  DAY_KEYS.forEach((k,i)=>{
    const d=new Date(mon);d.setDate(d.getDate()+i);
    const el=document.createElement('button');
    el.className='daypill'+(k===ui.selDay?' sel':'')+(ui.weekOff===0&&k===tk?' today':'');
    const dl=S.logs[iso(d)];
    if(dl&&((dl.sets&&Object.values(dl.sets).some(a=>a.some(s=>s&&s.d)))||(dl.checks&&Object.values(dl.checks).some(Boolean))))el.classList.add('logged');
    el.innerHTML='<span class="dw">'+k.slice(0,3).toUpperCase()+(S.swap[iso(d)]?'<span style="color:var(--accent)"> \u21C4</span>':'')+'</span><span class="dn">'+d.getDate()+'</span><span class="dot"></span>';
    el.addEventListener('click',()=>{ui.selDay=k;renderHeader();render();});
    strip.appendChild(el);
  });
  strip.appendChild(mkNav(1,'Next week'));
}

/* ============================================================ TODAY VIEW ============================================================ */
function setsDoneCount(l,day,wk){
  let done=0,total=0;
  (day.ex||[]).forEach(e=>{
    const t=parseT(e.w[wk!=null?wk:S.settings.week]);total+=t.sets;
    const arr=l&&l.sets&&l.sets[slug(e.n)];
    if(arr)done+=arr.filter(s=>s&&s.d).length;
  });
  return{done,total};
}

function renderToday(){
  const v=$('#view');
  const pos=progAt(ui.weekOff), vP=pos.p, vW=pos.w;
  const tISO=selDate();               /* each weekday logs against its own date */
  const dayKey=effKey(tISO,ui.selDay), ph=PROGRAM[vP], day=ph.days[dayKey];
  const swapped=dayKey!==ui.selDay;
  const isToday=tISO===todayISO();
  const l=log(tISO);
  const editable=true;
  let h='';

  if(day.steps||day.rest){
    const checked=l&&l.checks&&l.checks.goal;
    h+='<div class="sessionhead"><div><h1>'+(day.rest?'Rest Day':'Active Recovery')+'</h1>'+
       '<div class="sub">'+fmtDate(tISO)+(day.rest?' · Recovery':'')+'</div></div>'+swapBtn()+shareBtn()+'</div>';
    if(swapped)h+='<div style="margin:-2px 0 12px"><span class="futurechip">\u21C4 Swapped \u00B7 doing '+DAY_NAMES[dayKey]+'\u2019s session</span></div>';
    if(!isToday)h+='<div style="margin:-2px 0 12px"><span class="futurechip">'+(tISO>todayISO()?'Logging ahead':'Backfilling')+' · '+fmtDate(tISO)+' · '+ph.name+' W'+(vW+1)+'</span></div>';
    h+=bwCard(tISO);
    h+='<div class="restcard"><div class="big">'+(day.rest?'REST':'10K')+'</div>'+
       '<div class="lbl">'+(day.rest?(day.note||'Recovery'):'steps today')+'</div>'+
       (day.rest?'':'<p>Get your steps in — walking counts.</p>')+
       (editable?'<button class="bigchk'+(checked?' on':'')+'" data-goal="1">'+
        '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'+
        (checked?'Done!':'Mark done')+'</button>':'')+
       '</div>';
    if(dayKey==='wed')h+=chkCard('abs','Ab Workout',ABS.wed,l,editable,'abs');
    if(!day.rest)h+=chkCard('cardio','Cardio',[{n:'Fast walking',q:'20 min'}],l,editable,'run');
  }else{
    const p=setsDoneCount(l,day,vW);
    const pct=p.total?Math.round(100*p.done/p.total):0;
    const C=2*Math.PI*24;
    h+='<div class="sessionhead">'+
      '<div class="ring"><svg width="56" height="56"><circle cx="28" cy="28" r="24" fill="none" stroke="var(--line)" stroke-width="5"/>'+
      '<circle cx="28" cy="28" r="24" fill="none" stroke="'+(pct>=100?'var(--good)':'var(--accent)')+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-pct/100))+'"/></svg>'+
      '<div class="pct">'+pct+'<span style="font-size:9px">%</span></div></div>'+
      '<div><h1>'+esc(day.title)+'</h1><div class="sub">'+fmtDate(tISO)+(day.sub?' · '+esc(day.sub):'')+' · '+p.done+' / '+p.total+' sets</div></div>'+swapBtn()+shareBtn()+'</div>';

    if(swapped)h+='<div style="margin:-2px 0 12px"><span class="futurechip">\u21C4 Swapped \u00B7 doing '+DAY_NAMES[dayKey]+'\u2019s session</span></div>';
    if(!isToday)h+='<div style="margin:-2px 0 12px"><span class="futurechip">'+(tISO>todayISO()?'Logging ahead':'Backfilling')+' · '+fmtDate(tISO)+' · '+ph.name+' W'+(vW+1)+'</span></div>';
    h+=bwCard(tISO);
    /* warm-up */
    h+=chkCard('warmup','Warm-Up · '+(day.type==='lower'?'Lower':'Upper'),WARMUP[day.type],l,editable,'flame');

    /* exercises, with superset grouping */
    let i=0;const ex=day.ex;
    while(i<ex.length){
      if(ex[i].ss!=null){
        const g=ex[i].ss;let j=i;let cards='';
        const rounds=parseT(ex[i].w[vW]).sets;
        while(j<ex.length&&ex[j].ss===g){cards+=exCard(ex[j],l,editable,tISO,vW);j++;}
        h+='<div class="ssgroup"><div class="sslabel">Superset · '+rounds+' rounds</div>'+cards+'</div>';
        i=j;
      }else{h+=exCard(ex[i],l,editable,tISO,vW);i++;}
    }
    /* abs on mon & sat */
    if(dayKey==='mon'||dayKey==='sat')h+=chkCard('abs','Ab Workout · End of Session',ABS.monsat,l,editable,'abs');
    /* cardio + cooldown */
    h+=chkCard('cardio','Cardio · Post Workout',[{n:'Fast walking',q:'20 min'}],l,editable,'run');
    h+=chkCard('cooldown','Cool-Down · '+(day.type==='lower'?'Lower':'Upper'),COOLDOWN[day.type],l,editable,'wind');
  }
  v.innerHTML=h;
  bindToday(dayKey,tISO,vP,vW);
}

function chkCard(key,name,items,l,editable,icon){
  const checks=(l&&l.checks)||{};
  const nOn=items.filter((_,i)=>checks[key+'-'+i]).length;
  const open=nOn>0&&nOn<items.length;
  let h='<details class="card chkcard"'+(open?' open':'')+'><summary>'+
    '<div class="cticon">'+(ICONS[icon]||'')+'</div>'+
    '<div class="ctname">'+esc(name)+'</div>'+
    '<div class="ctstate">'+nOn+'/'+items.length+'</div>'+
    '<svg class="caret" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>'+
    '</summary><div class="chkitems">';
  items.forEach((it,i)=>{
    const on=!!checks[key+'-'+i];
    h+='<button class="chkitem'+(on?' on':'')+'" data-chk="'+key+'-'+i+'"'+(editable?'':' disabled')+'>'+
      '<span class="box"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>'+
      '<span class="lbl">'+esc(it.n)+'</span><span class="qty">'+esc(it.q)+'</span></button>';
  });
  return h+'</div></details>';
}

function exCard(e,l,editable,tISO,vW){
  const sl=slug(e.n);
  const t=parseT(e.w[vW!=null?vW:S.settings.week]);
  const saved=(l&&l.sets&&l.sets[sl])||[];
  const last=lastSession(sl,tISO);
  let lastChip='',histDiv='';
  if(last){
    const done=last.sets.filter(s=>s&&s.d);
    const ws=[...new Set(done.map(s=>s.w||'–'))];
    const summary=(ws.length===1?ws[0]+' kg':ws.join('/')+' kg')+' × '+done.map(s=>s.r||'?').join(', ');
    lastChip='<button class="lastchip" data-hist="'+sl+'">Last · <b>'+esc(summary)+'</b>'+
      '<svg class="caret" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>';
    const hist=exHistory(sl,8);
    histDiv='<div class="exhist" data-histpanel="'+sl+'"><div class="ehtitle">Every session · '+esc(e.n)+'</div>'+
      hist.map(h=>'<div class="ehrow"><span class="ehd">'+fmtDate(h.date)+' · <b>'+esc(h.tag)+'</b></span>'+
      '<span class="ehsets">'+esc(h.sets.join(' · '))+'</span></div>').join('')+'</div>';
  }
  let rows='';
  for(let i=0;i<t.sets;i++){
    const s=saved[i]||{};
    const prevW=(last&&last.sets[i]&&last.sets[i].w)||(last&&last.sets[0]&&last.sets[0].w)||'';
    rows+='<div class="setrow'+(s.d?' done':'')+'" data-ex="'+sl+'" data-i="'+i+'">'+
      '<span class="sn">'+(i+1)+'</span>'+
      '<span class="fld"><input type="text" inputmode="decimal" class="w" placeholder="'+(prevW||'–')+'" value="'+(s.w!=null?s.w:'')+'"'+(editable?'':' readonly')+' aria-label="Weight kg"><span class="unit">KG</span></span>'+
      '<span class="fld"><input type="text" inputmode="numeric" class="r" placeholder="'+t.reps+'" value="'+(s.r!=null?s.r:'')+'"'+(editable?'':' readonly')+' aria-label="Reps"><span class="unit">REPS</span></span>'+
      '<button class="chk" aria-label="Complete set">'+
      '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button></div>';
  }
  return '<div class="card"><div class="exhead"><div class="exname">'+esc(e.n)+'</div>'+
    '<div class="target">'+t.sets+' × '+t.reps+'</div></div>'+
    '<div class="exmeta">'+(e.note?'<span class="note">'+esc(e.note)+'</span>':'')+lastChip+'</div>'+
    histDiv+
    '<div class="sets">'+rows+'</div></div>';
}

function bindToday(dayKey,tISO,vP,vW){
  const v=$('#view');
  v.querySelectorAll('.setrow .chk').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const row=btn.closest('.setrow');
      const sl=row.dataset.ex,i=+row.dataset.i;
      const l=ensureLog(tISO,dayKey,vP,vW);
      if(!l.sets[sl])l.sets[sl]=[];
      const wIn=row.querySelector('.w'),rIn=row.querySelector('.r');
      const cur=l.sets[sl][i];
      if(cur&&cur.d){ /* un-check */
        cur.d=0;row.classList.remove('done');saveState();renderHeaderOnly();return;
      }
      const w=wIn.value.trim()||wIn.placeholder.replace('kg','').trim();
      const r=rIn.value.trim()||rIn.placeholder.split('–')[0].replace(/[^0-9]/g,'');
      l.sets[sl][i]={w:w,r:r,d:1};
      wIn.value=w;rIn.value=r;
      row.classList.add('done');
      spawnLift(row);
      if(navigator.vibrate)navigator.vibrate(35);
      /* copy weight down to later empty rows of this exercise */
      v.querySelectorAll('.setrow[data-ex="'+sl+'"]').forEach(o=>{
        if(+o.dataset.i>i){const ow=o.querySelector('.w');if(!ow.value)ow.placeholder=w||ow.placeholder;}
      });
      saveState();renderHeaderOnly();
      /* rest timer from target reps */
      const day=PROGRAM[vP].days[dayKey];
      const e=(day.ex||[]).find(x=>slug(x.n)===sl);
      if(e)startTimer(restFor(parseT(e.w[vW]).repN));
      /* update ring */
      updateRing(dayKey,tISO,vP,vW);
    });
  });
  v.querySelectorAll('.setrow input').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const row=inp.closest('.setrow');
      const sl=row.dataset.ex,i=+row.dataset.i;
      const l=ensureLog(tISO,dayKey,vP,vW);
      if(!l.sets[sl])l.sets[sl]=[];
      const cur=l.sets[sl][i]||{d:0};
      cur.w=row.querySelector('.w').value.trim();
      cur.r=row.querySelector('.r').value.trim();
      l.sets[sl][i]=cur;saveState();
    });
  });
  v.querySelectorAll('[data-hist]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const panel=v.querySelector('[data-histpanel="'+btn.dataset.hist+'"]');
      if(panel){panel.classList.toggle('show');btn.classList.toggle('open',panel.classList.contains('show'));}
    });
  });
  v.querySelectorAll('[data-chk]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const l=ensureLog(tISO,dayKey,vP,vW);
      const k=btn.dataset.chk;
      l.checks[k]=!l.checks[k];
      btn.classList.toggle('on',l.checks[k]);
      const card=btn.closest('.chkcard');
      const n=card.querySelectorAll('.chkitem.on').length;
      card.querySelector('.ctstate').textContent=n+'/'+card.querySelectorAll('.chkitem').length;
      if(navigator.vibrate)navigator.vibrate(20);
      saveState();renderHeaderOnly();
    });
  });
  const goal=v.querySelector('[data-goal]');
  if(goal)goal.addEventListener('click',()=>{
    const l=ensureLog(tISO,dayKey,vP,vW);
    l.checks.goal=!l.checks.goal;saveState();renderToday();renderHeaderOnly();
  });
  const sh=v.querySelector('#sharebtn');
  if(sh)sh.addEventListener('click',()=>shareDay(dayKey,tISO,vP,vW));
  const sw=v.querySelector('#swapbtn');
  if(sw)sw.addEventListener('click',()=>openSwapSheet(tISO,vP));
  const bw=v.querySelector('#bwin');
  if(bw)bw.addEventListener('change',()=>{
    const raw=bw.value.trim().replace(',','.');
    if(raw===''){delete S.bw[tISO];saveState();renderHeaderOnly();return;}
    const val=parseFloat(raw);
    if(isNaN(val)||val<25||val>350){toast('Enter a valid weight in kg');return;}
    S.bw[tISO]=Math.round(val*10)/10;saveState();toast('Body weight saved ✓');
    const prev=prevBw(tISO);const dEl=v.querySelector('#bwdelta');
    if(dEl&&prev){const d=Math.round((S.bw[tISO]-prev.kg)*10)/10;
      dEl.innerHTML='<b>'+(d>0?'+':'')+d+' kg</b>vs '+fmtDate(prev.date).replace(/^\w+ /,'');}
  });
}
function updateRing(dayKey,tISO,vP,vW){
  const day=PROGRAM[vP!=null?vP:S.settings.phase].days[dayKey];if(!day.ex)return;
  const l=log(tISO);
  const p=setsDoneCount(l,day,vW);
  const pct=p.total?Math.round(100*p.done/p.total):0;
  const ring=$('#view .ring');if(!ring)return;
  const C=2*Math.PI*24;
  const c2=ring.querySelectorAll('circle')[1];
  c2.setAttribute('stroke-dashoffset',C*(1-pct/100));
  c2.setAttribute('stroke',pct>=100?'var(--good)':'var(--accent)');
  ring.querySelector('.pct').innerHTML=pct+'<span style="font-size:9px">%</span>';
  const sub=$('#view .sessionhead .sub');
  if(sub)sub.innerHTML=sub.innerHTML.replace(/\d+ \/ \d+ sets/,p.done+' / '+p.total+' sets');
  if(pct>=100)toast('Session complete. Strong work! 💪');
}
function renderHeaderOnly(){renderHeader();}

let planPhase=null,planWeek=null;

  if(planPhase==null)planPhase=S.settings.phase;
  if(planWeek==null)planWeek=S.settings.week;
  const ph=PROGRAM[planPhase];
  let h='<div class="sessionhead" style="margin-top:14px"><div><h1>The Plan</h1>'+
    '<div class="sub">5-day gym program · '+PROGRAM.length+' phases · tap a day to expand</div></div></div>';
  h+='<div class="chiprow">'+PROGRAM.map((p,i)=>'<button class="selchip'+(i===planPhase?' sel':'')+'" data-pp="'+i+'">'+p.name+(p.level?' · '+p.level:'')+'</button>').join('')+'</div>';
  h+='<div class="chiprow">'+ph.weeks.map((w,i)=>'<button class="selchip'+(i===planWeek?' sel':'')+'" data-pw="'+i+'">'+w+'</button>').join('')+'</div>';
  DAY_KEYS.forEach(k=>{
    const d=ph.days[k];
    let title,sub='';
    if(d.steps){title='Active Recovery';sub='10K steps'+(k==='wed'?' + abs':'');}
    else if(d.rest){title='Rest';sub=d.note||'';}
    else{title=d.title;sub=(d.sub?d.sub+' · ':'')+d.ex.length+' exercises';}
    h+='<details class="card planday"><summary><span class="pdw">'+k.slice(0,3)+'</span>'+
      '<span class="pdt">'+esc(title)+'</span><span class="pdn">'+esc(sub)+'</span>'+
      '<svg class="caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="color:var(--faint)"><path d="m6 9 6 6 6-6"/></svg></summary>';
    if(d.ex){
      h+='<table class="plantable"><tbody>';
      let lastSS=null;
      d.ex.forEach(e=>{
        const t=parseT(e.w[planWeek]);
        if(e.ss!=null&&e.ss!==lastSS){h+='<tr class="ssrow"><td colspan="2">Superset · '+t.sets+' rounds</td></tr>';lastSS=e.ss;}
        if(e.ss==null)lastSS=null;
        h+='<tr><td>'+esc(e.n)+(e.note?'<div class="note">'+esc(e.note)+'</div>':'')+'</td><td>'+t.sets+' × '+t.reps+'</td></tr>';
      });
      h+='</tbody></table>';
    }else{
      h+='<div style="padding:0 15px 14px;color:var(--muted);font-size:13.5px">'+(d.rest?(d.note||'Full rest.'):'Aim for 10,000 steps.'+(k==='wed'?' Ab workout: Leg Raises 3×20, Russian Twists 3×15, Crunches 4×20.':''))+'</div>';
    }
    h+='</details>';
  });
  h+='<div class="secttl">Reference</div><div class="refgrid">';
  h+='<div class="refcard"><h4>Rest Intervals</h4><ul><li>12+ reps<b>30 sec</b></li><li>8–10 reps<b>120 sec</b></li><li>&lt; 8 reps<b>180 sec</b></li></ul></div>';
  h+='<div class="refcard"><h4>Daily Cardio</h4><ul><li>Fast walk, post-workout<b>20 min</b></li><li>Wed / Sun<b>10K steps</b></li></ul></div>';
  h+='<div class="refcard"><h4>Abs · Mon &amp; Sat</h4><ul>'+ABS.monsat.map(a=>'<li>'+esc(a.n)+'<b>'+a.q+'</b></li>').join('')+'</ul></div>';
  h+='<div class="refcard"><h4>Abs · Wednesday</h4><ul>'+ABS.wed.map(a=>'<li>'+esc(a.n)+'<b>'+a.q+'</b></li>').join('')+'</ul></div>';
  h+='</div>';
  h+='<p class="credit">EA = each arm / leg / side · Plan by Coach Allan J. Fernandes · Livezy</p>';
  $('#view').innerHTML=h;
  $('#view').querySelectorAll('[data-pp]').forEach(b=>b.addEventListener('click',()=>{planPhase=+b.dataset.pp;planWeek=0;renderPlan();}));
  $('#view').querySelectorAll('[data-pw]').forEach(b=>b.addEventListener('click',()=>{planWeek=+b.dataset.pw;renderPlan();}));
}

/* ============================================================ HISTORY VIEW ============================================================ */
function renderHistory(){
  const dates=Object.keys(S.logs).sort().reverse()
    .filter(d=>{const l=S.logs[d];
      return (l.sets&&Object.values(l.sets).some(a=>a.some(s=>s&&s.d)))||(l.checks&&Object.values(l.checks).some(Boolean));});
  let h='<div class="sessionhead" style="margin-top:14px"><div><h1>History</h1>'+
    '<div class="sub">'+dates.length+' session'+(dates.length===1?'':'s')+' logged</div></div></div>';

  /* body-weight trend */
  const bwDates=Object.keys(S.bw).sort().reverse();
  if(bwDates.length){
    const latest=bwDates[0];
    const weekAgoISO=(()=>{const d=new Date(latest+'T12:00:00');d.setDate(d.getDate()-7);return iso(d);})();
    const ref=bwDates.find(d=>d<=weekAgoISO);
    let trend='';
    if(ref){const d7=Math.round((S.bw[latest]-S.bw[ref])*10)/10;
      trend='<span class="lastchip">'+(d7>0?'+':'')+d7+' kg over 7 days</span>';}
    h+='<div class="card"><div class="exhead"><div class="exname">Body Weight</div>'+
      '<div class="target">'+S.bw[latest]+' kg</div></div>'+
      '<div class="exmeta"><span class="note">Latest · '+fmtDate(latest)+'</span>'+trend+'</div>'+
      '<div class="histbody" style="padding-top:6px">'+
      bwDates.slice(0,8).map((d,i)=>{
        const nxt=bwDates[i+1];
        const dl=nxt!=null?Math.round((S.bw[d]-S.bw[nxt])*10)/10:null;
        return '<div class="ehrow"><span class="ehd">'+fmtDate(d)+'</span>'+
          '<span class="ehsets">'+S.bw[d]+' kg'+(dl!=null?' <span style="color:var(--faint)">('+(dl>0?'+':'')+dl+')</span>':'')+'</span></div>';
      }).join('')+
      '</div></div>';
  }

  if(!dates.length){
    h+='<div class="empty"><div class="glyph">— KG —</div><p style="margin-top:10px">No sessions yet.<br>Your logged workouts will appear here.</p></div>';
    $('#view').innerHTML=h;return;
  }
  dates.forEach(d=>{
    const l=S.logs[d];
    const ph=PROGRAM[l.phase]||curPhase();
    const day=ph.days[l.day]||{};
    let nSets=0,vol=0;
    if(l.sets)Object.values(l.sets).forEach(a=>a.forEach(s=>{if(s&&s.d){nSets++;
      const w=parseFloat(s.w),r=parseFloat(s.r);if(w&&r)vol+=w*r;}}));
    h+='<details class="card histcard"><summary>'+
      '<div><div class="histdate">'+fmtDate(d)+'</div>'+
      '<div class="histmeta">'+esc(day.title||(day.steps?'Active Recovery':day.rest?'Rest':''))+' · '+ph.name+' '+(ph.weeks[l.week]||'')+'</div></div>'+
      '<div class="histstat"><div class="v">'+(vol?(Math.round(vol/100)/10)+'t':nSets+' sets')+'</div><div class="k">'+(vol?'volume':'done')+'</div></div>'+
      '<svg class="caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="color:var(--faint);margin-left:8px"><path d="m6 9 6 6 6-6"/></svg>'+
      '</summary><div class="histbody">';
    if(l.sets&&day.ex){
      day.ex.forEach(e=>{
        const arr=l.sets[slug(e.n)];if(!arr||!arr.some(s=>s&&s.d))return;
        h+='<div class="histex"><div class="hn">'+esc(e.n)+'</div><div class="hs">'+
          arr.map((s,i)=>s&&s.d?'<span class="setchip">'+(s.w||'–')+' kg × '+(s.r||'–')+'</span>':'').join('')+
          '</div></div>';
      });
    }
    const checkNames={goal:'Step goal',};
    const done=l.checks?Object.keys(l.checks).filter(k=>l.checks[k]):[];
    if(done.length){
      const groups={warmup:'Warm-up',abs:'Abs',cardio:'Cardio',cooldown:'Cool-down',goal:'Step goal'};
      const seen=[...new Set(done.map(k=>k.split('-')[0]))].map(g=>groups[g]||g);
      h+='<div class="histex"><div class="hn" style="color:var(--muted)">Also completed</div><div class="hs">'+
        seen.map(s=>'<span class="setchip">'+s+' ✓</span>').join('')+'</div></div>';
    }
    h+='<button class="dangerbtn" data-del="'+d+'">Delete this log</button>';
    h+='</div></details>';
  });
  $('#view').innerHTML=h;
  $('#view').querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click',()=>{
      if(b.dataset.armed){delete S.logs[b.dataset.del];saveState();renderHistory();renderHeader();toast('Log deleted');}
      else{b.dataset.armed='1';b.textContent='Tap again to confirm delete';setTimeout(()=>{delete b.dataset.armed;b.textContent='Delete this log';},2500);}
    });
  });
}

       '<input id="synctokenin" type="password" autocomplete="off" placeholder="Paste GitHub token (ghp_… / github_pat_…)" style="width:100%;padding:12px;font-size:13px;margin-top:10px">'+
       '<button class="sheetbtn" id="syncconnect"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9z"/></svg><span>Connect &amp; sync<small>Verifies the token and pushes your first backup</small></span></button>')+
    '<button class="sheetbtn danger" id="resetbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14zM10 11v6M14 11v6"/></svg><span>Reset everything<small>Erase all logs and settings</small></span></button>'+
    (storageOK?'':'<p style="color:var(--danger);font-size:12px;margin-top:12px">⚠ Storage unavailable in this view — data won’t persist after closing. Use Back up to save your logs.</p>');
  sh.innerHTML=h;
  sh.classList.add('show');$('#scrim').classList.add('show');
  sh.querySelectorAll('[data-sp]').forEach(b=>b.addEventListener('click',()=>{
    S.settings.phase=+b.dataset.sp;S.settings.week=0;S.settings.anchor=anchorForNewSelection();
    planPhase=null;planWeek=null;saveState();renderHeader();render();openSheet();
  }));
  sh.querySelectorAll('[data-sw]').forEach(b=>b.addEventListener('click',()=>{
    S.settings.week=+b.dataset.sw;S.settings.anchor=anchorForNewSelection();
    saveState();renderHeader();render();openSheet();
  }));
  $('#backupbtn').addEventListener('click',doBackup);
  $('#restorebtn').addEventListener('click',()=>{const w=$('#restorewrap');w.style.display=w.style.display==='none'?'block':'none';});
  $('#doimport').addEventListener('click',()=>{
    try{
      const data=JSON.parse(sh.querySelector('#restorewrap textarea').value);
      if(!data.logs||!data.settings)throw 0;
      S=data;saveState();closeSheet();renderHeader();render();toast('Backup restored ✓');
    }catch(e){toast('That doesn’t look like a valid backup');}
  });
  const sc=$('#syncconnect');
  if(sc)sc.addEventListener('click',async()=>{
    const t=$('#synctokenin').value.trim();
    if(!t){toast('Paste a token first');return;}
    SY.token=t;SY.gistId='';saveSync();
    /* new-phone flow: if a cloud backup already exists and this device is empty, pull instead of push */
    const existing=await findExistingGist();
    const hasLocal=Object.keys(S.logs).length>0||Object.keys(S.bw).length>0;
    if(existing&&!hasLocal){SY.gistId=existing;saveSync();await restoreCloud();openSheet();}
    else{await pushCloud(true);openSheet();}
  });
  const sn=$('#syncnow');if(sn)sn.addEventListener('click',()=>pushCloud(true));
  const sr=$('#syncrestore');
  if(sr)sr.addEventListener('click',function(){
    if(this.dataset.armed){restoreCloud();}
    else{this.dataset.armed='1';
      this.querySelector('span').innerHTML='Tap again to confirm<small>Replaces data on this device with the cloud copy</small>';
      setTimeout(()=>{delete this.dataset.armed;
        if(document.body.contains(this))this.querySelector('span').innerHTML='Restore from cloud<small>Replace this device’s data with the last sync</small>';},2600);}
  });
  const so=$('#syncoff');
  if(so)so.addEventListener('click',()=>{SY={token:'',gistId:'',last:0};saveSync();openSheet();toast('Cloud sync disconnected');});
  $('#resetbtn').addEventListener('click',function(){
    if(this.dataset.armed){S={settings:{phase:0,week:0,anchor:iso(mondayOf(new Date()))},logs:{}};saveState();closeSheet();renderHeader();render();toast('All data reset');}
    else{this.dataset.armed='1';this.querySelector('span').innerHTML='Tap again to confirm<small>This erases everything</small>';
      setTimeout(()=>{delete this.dataset.armed;this.querySelector('span').innerHTML='Reset everything<small>Erase all logs and settings</small>';},2600);}
  });
}
function closeSheet(){$('#sheet').classList.remove('show');$('#scrim').classList.remove('show');}
$('#scrim').addEventListener('click',closeSheet);
$('#settingsbtn').addEventListener('click',openSheet);
$('#phasebtn').addEventListener('click',openSheet);
$('#todaychip').addEventListener('click',()=>{ui.weekOff=0;ui.selDay=todayDayKey();renderHeader();render();});

async function doBackup(){
  const json=JSON.stringify(S,null,1);
  const fname='training-log-backup-'+todayISO()+'.json';
  if(window.claude&&window.claude.downloads){
    try{await window.claude.downloads.save({filename:fname,data:json});toast('Backup saved ✓');return;}
    catch(err){
      if(err&&err.code==='declined'){toast('Backup cancelled');return;}
      if(err&&err.code==='rate_limited'){toast('One moment — try again');return;}
      /* fall through to clipboard for unavailable/etc. */
    }
  }
  try{await navigator.clipboard.writeText(json);toast('Backup copied to clipboard — paste it somewhere safe');}
  catch(e){toast('Could not export — long-press to copy from Restore box');
    const w=$('#restorewrap');if(w){w.style.display='block';w.querySelector('textarea').value=json;}}
}

/* ============================================================ DAY SWAP ============================================================ */
function dayTitleFor(vP,key){
  const d=PROGRAM[vP].days[key];
  return d.title?d.title+(d.sub?' ('+d.sub+')':''):(d.rest?'Rest':'10K steps');
}
function doSwap(aISO,bISO){
  const ea=effKey(aISO,weekdayKey(aISO)), eb=effKey(bISO,weekdayKey(bISO));
  S.swap[aISO]=eb;S.swap[bISO]=ea;
  if(S.swap[aISO]===weekdayKey(aISO))delete S.swap[aISO];
  if(S.swap[bISO]===weekdayKey(bISO))delete S.swap[bISO];
  saveState();
}
function openSwapSheet(tISO,vP){
  const sh=$('#sheet');
  const mon=mondayOf(new Date());mon.setDate(mon.getDate()+ui.weekOff*7);
  const days=DAY_KEYS.map((k,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);return{k:k,iso:iso(d)};});
  const anySwap=days.some(d=>S.swap[d.iso]);
  let h='<div class="grab"></div><h3>Swap this day</h3>'+
    '<p style="font-size:12.5px;color:var(--muted);margin:2px 0 6px;line-height:1.5">Trade <b>'+fmtDate(tISO)+
    '</b> ('+esc(dayTitleFor(vP,effKey(tISO,weekdayKey(tISO))))+') with another day this week. Both days exchange their sessions.</p>';
  days.forEach(d=>{
    if(d.iso===tISO)return;
    h+='<button class="sheetbtn" data-swapwith="'+d.iso+'"><span style="font-family:var(--disp);font-weight:700;letter-spacing:.08em;width:38px;color:var(--faint)">'+d.k.slice(0,3).toUpperCase()+'</span>'+
      '<span>'+esc(dayTitleFor(vP,effKey(d.iso,d.k)))+'<small>'+fmtDate(d.iso)+(S.swap[d.iso]?' · swapped':'')+'</small></span></button>';
  });
  if(anySwap)h+='<button class="sheetbtn danger" id="swapreset"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span>Reset this week to the plan<small>Removes all swaps in this week</small></span></button>';
  sh.innerHTML=h;
  sh.classList.add('show');$('#scrim').classList.add('show');
  sh.querySelectorAll('[data-swapwith]').forEach(b=>b.addEventListener('click',()=>{
    doSwap(tISO,b.dataset.swapwith);
    closeSheet();renderHeader();render();
    toast('Swapped \u2014 '+fmtDate(tISO)+' now: '+dayTitleFor(vP,effKey(tISO,weekdayKey(tISO))));
  }));
  const rs=sh.querySelector('#swapreset');
  if(rs)rs.addEventListener('click',()=>{
    days.forEach(d=>{delete S.swap[d.iso];});
    saveState();closeSheet();renderHeader();render();toast('Week reset to the plan');
  });
}

/* ============================================================ TABS + BOOT ============================================================ */
function render(){
  if(ui.tab==='today')renderToday();
  else if(ui.tab==='plan')renderPlan();
  else renderHistory();
}
$('#tabbar').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;
  ui.tab=b.dataset.tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('sel',t===b));
  if(ui.tab==='today'){ui.selDay=todayDayKey();ui.weekOff=0;renderHeader();}
  render();window.scrollTo({top:0});
});
renderHeader();render();
if(!storageOK)setTimeout(()=>toast('⚠ Storage is blocked in this view — use Back up in settings before closing'),1200);
</script>
